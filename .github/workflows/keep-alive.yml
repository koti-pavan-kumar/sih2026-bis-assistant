name: Keep Backend Awake

# Render's free plan spins the service down after 15 minutes without inbound
# traffic, and the first request after that takes 60-90s (cold start) — judges
# would see a slow site. This workflow pings the health endpoint to keep it warm.
#
# IMPORTANT: GitHub frequently delays or skips scheduled runs (community
# reports show multi-hour gaps even for */10 crons — our own history had
# 160-284 min gaps). To compensate, THREE offset schedules fire every ~5 min
# at staggered minutes, so even if GitHub only materializes a fraction of them
# the backend still sees a request well inside its 15-minute sleep window.
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '2-57/5 * * * *'
    - cron: '4-59/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping Render health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake backend
        run: |
          URL="https://manakmitra-backend.onrender.com/api/health"
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            # First request after sleep can take ~60-90s (cold start), hence long max-time
            if code=$(curl -s -o /tmp/health.json -w "%{http_code}" -m 100 "$URL"); then
              echo "HTTP $code"
              if [ "$code" = "200" ]; then
                echo "Backend awake: $(cat /tmp/health.json)"
                exit 0
              fi
            else
              echo "curl failed (timeout or connection error)"
            fi
            sleep 20
          done
          echo "Backend did not respond after 3 attempts"
          exit 1
